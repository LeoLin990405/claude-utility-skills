name: Feature Request
description: Suggest a new skill or improvement to an existing one
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe your idea below.

  - type: dropdown
    id: type
    attributes:
      label: Request Type
      options:
        - New skill
        - Improvement to existing skill
        - New template
        - Documentation improvement
        - Other
    validations:
      required: true

  - type: input
    id: skill
    attributes:
      label: Related Skill (if applicable)
      description: Which existing skill does this relate to?
      placeholder: "e.g., mcp-builder, skill-creator"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the feature or improvement.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe the problem this would solve or the workflow it enables.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches you have considered.
    validations:
      required: false
